<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talenta</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6f2;--side:#fff;--sidetx:#2b1759;--p:#4b248c;--pl:#e7dfff;--pt:#4b248c;--tx:#1d1530;--mu:#8a84a0;--bd:#4b248c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1626;--side:#2a2340;--sidetx:#e9e2ff}}
:root[data-theme="dark"]{--bg:#1a1626;--side:#2a2340;--sidetx:#e9e2ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);font-family:Manrope,system-ui,sans-serif;display:flex;gap:24px;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);color:var(--tx)}
#side{width:220px;background:var(--side);color:var(--sidetx);border-radius:12px;padding:14px;font-size:13px}
#side select{width:100%;margin-top:8px;padding:8px;border-radius:8px;font:inherit}
.ph{width:390px;height:844px;max-height:100vh;background:#fff;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 10px 40px #0004;color:var(--tx)}
.sb{display:flex;justify-content:space-between;padding:12px 28px 4px;font-weight:700;font-size:15px}
.sc{flex:1;overflow:auto;padding:0 20px 20px}
.hd{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;text-align:center;color:var(--pt);font-weight:600;font-size:16px;padding:10px 0 14px}
.bk{width:22px;height:22px;border:1.5px solid var(--p);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:16px;line-height:1;cursor:pointer}
.nav{display:flex;justify-content:space-around;padding:12px 0 16px;border-top:2px solid var(--pl);color:var(--p)}
.nav i{cursor:pointer;opacity:.9;padding:2px 8px;border-radius:8px}.nav i.on{background:var(--p);color:#fff;--bi:#4b248c}
h2{font-size:15px;color:var(--pt);margin:16px 0 8px;font-weight:700}h1{font-size:19px;color:var(--pt);margin:6px 0 2px}
.s{font-size:11.5px;color:var(--pt)}.mu{color:var(--mu)}
.box{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;color:var(--pt)}
.row b{font-weight:600}.row span:last-child{color:var(--tx);text-align:right}
.btn{display:block;width:100%;background:var(--p);color:#fff;border:1px solid var(--p);border-radius:6px;padding:13px;font:600 14px Manrope;text-align:center;cursor:pointer;margin-top:10px}
.btn.o{background:#fff;color:var(--p)}.btn.l{background:var(--pl);color:var(--p);border-color:var(--p)}.btn.sm{display:inline-block;width:auto;padding:5px 12px;font-size:11px;margin:0}
.btn.d{background:#ffd9dc;color:#b00020;border-color:#ffd9dc}
.ch{display:inline-block;border:1px solid var(--p);color:var(--p);border-radius:99px;padding:2px 9px;font-size:10.5px;background:var(--pl);margin:2px 3px 2px 0;white-space:nowrap}
.tg{display:inline-block;border-radius:99px;padding:2px 9px;font-size:10.5px;font-weight:600}
.g{background:#d6f8de;color:#0a7a2a}.y{background:#fff0cf;color:#a96a00}.bl{background:#dbeafe;color:#1b57b8}.r{background:#ffd9dc;color:#b00020}.gr{background:#ddd;color:#555}
.pill{display:inline-block;padding:7px 16px;border:1px solid var(--p);border-radius:99px;font-size:12px;color:var(--p);cursor:pointer;margin-right:6px}.pill.on{background:var(--p);color:#fff}
.th{width:62px;height:62px;border-radius:6px;flex:none;display:grid;place-items:center;font-weight:800;font-size:22px;color:#7ff;overflow:hidden}
.fl{display:flex;gap:10px;align-items:center}.fl>div{min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}.av.dk{background:#14122b}
.pr{height:7px;background:#e6e1f2;border-radius:9px;overflow:hidden}.pr i{display:block;height:100%;background:var(--p)}
.hero{background:linear-gradient(135deg,#5326a6,#3b1a78);color:#fff;border-radius:8px;padding:14px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.st3 b{display:block;font-size:20px}
input,textarea,select.f{width:100%;border:1px solid var(--p);border-radius:6px;padding:11px;font:13px Manrope;margin:4px 0 8px;color:var(--tx);background:#fff}
.bub{max-width:78%;border:1px solid #bbb;border-radius:6px;padding:7px 9px;font-size:11.5px;margin:8px 0 2px;text-align:justify}.bub.me{margin-left:auto;background:var(--pl);border-color:#9d86e0}.tm{font-size:9px;color:var(--mu)}
.ov{position:absolute;inset:0;background:#0007;display:grid;place-items:center;padding:24px;z-index:5}
.md{background:#fff;border-radius:14px;padding:18px;width:100%;text-align:center}.md h3{color:var(--pt);margin:6px 0}.md .cc{font-size:44px;line-height:1}
.splash{background:linear-gradient(160deg,#3b2bd4,#4b248c 60%,#7a6cf0);color:#fff;display:grid;place-items:center;text-align:center;height:100%}
.ill{height:300px;border-radius:20px;background:linear-gradient(160deg,#c9b8f5,#8f7ae8);margin:30px 0 20px;display:grid;place-items:center;font-size:70px}
.gl{background:#fff var(--gl) top center/100% auto no-repeat;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.gl .sheet{background:#7b6a9f;border-radius:24px 24px 0 0;padding:20px 22px 30px;color:#fff}.gl h2{color:#4b248c;font-size:19px;margin:0 0 12px}.gl input{border:0}
.spl{position:relative;width:100%;height:100%;overflow:hidden;background:#fff;cursor:pointer}.spl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spa{animation:spz 1.6s cubic-bezier(.2,.7,.2,1) both}.spb{position:absolute;inset:0;background:#fff;clip-path:circle(0% at 50% 50%);animation:spr .9s cubic-bezier(.65,0,.35,1) 2.6s forwards}.spc{animation:spp .9s cubic-bezier(.2,1.3,.4,1) 3.2s both}
@keyframes spz{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}@keyframes spr{to{clip-path:circle(150% at 50% 50%)}}@keyframes spp{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes su{from{transform:translateY(100%)}to{transform:none}}@keyframes cfi{from{opacity:0}to{opacity:1}}
.fb #v>*{animation:fi .6s ease both}.sh{animation:su .75s cubic-bezier(.22,1,.36,1) both}
.sh{background:linear-gradient(180deg,#fbfafd 0%,#e8e2f0 50%,#c9bde0 100%);border-radius:38px 38px 0 0;box-shadow:0 -6px 24px rgba(40,20,90,.12);padding:34px 28px 36px;position:relative}
.sh:before{content:'';position:absolute;top:14px;left:50%;width:82px;height:4px;margin-left:-41px;border-radius:9px;background:#c2c0c6}
.sh h2{color:#4b248c;font-size:28px;font-weight:800;line-height:1.12;margin:26px 0 22px;padding-right:34px}
.sh label{display:block;font-size:15px;font-weight:500;color:#000;margin:0 0 7px}
.sh input{height:44px;border:1px solid #d9d4e3;border-radius:10px;background:#fff;padding:0 14px;font:12.5px Manrope;margin:0 0 18px;box-shadow:none}.sh input::placeholder{color:#a3a0ab}
.lb{height:50px;border-radius:6px;background:#4b248c;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:0 5px 10px rgba(75,36,140,.28);cursor:pointer;margin-top:34px}
.ft{text-align:center;font-size:13px;color:#2a1160;margin-top:12px}.ft u{cursor:pointer}
.rt{font-size:22px;font-weight:600;color:#4b248c;text-align:center;margin:30px 0 16px}.rb{height:42px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:15px;margin-top:12px;cursor:pointer}
.si{display:flex;gap:5px;align-items:center}.cc{animation:cf 7s ease-in-out infinite alternate,cfi .8s both;transform-box:fill-box;transform-origin:center}@keyframes cf{to{transform:translate(var(--dx),var(--dy)) scale(1.07)}}
@media(prefers-reduced-motion:reduce){.cc{animation:none!important}.spa,.spc,.sh,.fb #v>*{animation:none!important}.spb{animation:none;clip-path:none}}
.nx{width:22px;height:22px;border-radius:50%;background:#4b248c;color:#fff;display:grid;place-items:center;font-size:16px;cursor:pointer;line-height:1}.fb .sb{position:absolute;top:0;left:0;right:0;z-index:3}
@media(max-width:700px){#side{display:none}body{display:block}.ph{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0}#pk{display:block!important}}
#pk{display:none;position:fixed;top:4px;right:4px;z-index:9;font-size:10px;opacity:.6}

cpf:{n:'Profil Client',nav:1,f:()=>`<div style="height:90px;background:linear-gradient(90deg,#4b248c,#22104a);position:relative;margin-top:-4px"><div style="position:absolute;left:20px;bottom:-30px">${av('A',1,64)}</div></div><div class="sc" style="padding-top:40px"><h1>${ME.name}</h1><p class="s">${ME.cbio}</p><h2>Informasi Bisnis</h2><div class="box">${row('Industri',ME.ind)}${row('Lokasi',ME.loc)}</div><h2>Informasi Kontak</h2><div class="box">${row('Nomor Telepon',ME.ph)}${row('Email',ME.em)}</div><div class="btn" onclick="go('cpe')">Edit Profil</div><div class="btn o" onclick="logout()">Keluar</div></div>${nav('cpf')}`},
tpf:{n:'Profil Mahasiswa',nav:1,f:()=>`<div style="height:96px;background:linear-gradient(90deg,#4b248c,#22104a);position:relative;margin-top:-4px"><span class="ch" style="position:absolute;right:16px;top:10px;background:#fff;cursor:pointer" onclick="go('talx',0)">Preview</span><div style="position:absolute;left:20px;bottom:-32px;border:3px solid #fff;border-radius:50%">${av('M. Alif',0,64)}</div></div><div class="sc" style="padding-top:40px"><h1>${ME.name} ${vf}</h1><p class="s">${ME.bio}</p><h2>Informasi Mahasiswa</h2><div class="box">${row('Universitas',ME.uni)}${row('Program Studi',ME.prog)}${row('Status Verifikasi KTM','<span class="tg g" style="cursor:pointer" onclick="go(\'ktms\',\'approved\')">Terverifikasi</span>')}</div><h2>Keahlian</h2><div class="box">${ch(SKS.tpe)}</div><h2>Pengalaman</h2><div class="box s">${ME.exp.map(e=>'• '+e).join('<br>')}</div><h2>Tutorial Pemula</h2><div class="box fl" style="cursor:pointer" onclick="go('gd')"><div class="th" style="background:#4b248c;color:#fff;width:54px;height:54px">▶</div><div><b style="color:#4b248c">Langkah Memulai</b><div class="s">Pelajari langkah awal, alur kerja, dan tips sukses menyelesaikan proyek</div></div></div><div class="btn" onclick="go('tpe')">Edit Profil</div><div class="btn o" onclick="logout()">Keluar</div></div>${nav('tpf')}`},
tpe:{n:'Lengkapi Profil Mahasiswa',f:()=>`<div class="sc">${hd('Lengkapi Profil')}<div style="display:flex;justify-content:center">${av('M. Alif',0,80)}</div><div class="box" style="margin-top:14px"><div class="row"><b>Kelengkapan Profil</b><b>${ME.pc}%</b></div><div class="pr"><i style="width:${ME.pc}%"></i></div><div class="s mu" style="margin-top:4px">Lengkapi sisa data profil untuk mencapai 100% dan tingkatkan peluangmu di project!</div></div><h2>Informasi Pribadi</h2><div class="s">Nama lengkap</div><input id="f_name" value="${ME.name}"><div class="s">Domisili</div><input id="f_dom" value="${ME.dom}"><div class="s">Deskripsi singkat</div><textarea id="f_bio" rows="2">${ME.bio}</textarea><h2>Pendidikan</h2><div class="s">Universitas</div><input id="f_uni" value="${ME.uni}"><div class="s">Program studi</div><input id="f_prog" value="${ME.prog}"><div class="s">Semester</div><input id="f_sem" value="${ME.sem}"><h2>Keahlian</h2>${skui('tpe')}<h2>Pengalaman</h2><input id="f_e1" value="${ME.exp[0]||''}"><input id="f_e2" value="${ME.exp[1]||''}"><h2>Portofolio</h2><div class="box" style="border-style:dashed;border-color:#b9acd8;text-align:center;color:#8a84a0;padding:16px">${I('cld',26)}<br>Unggah portofolio kamu disini</div><div class="btn" onclick="svp()">${ob?'Simpan Profil':'Simpan Perubahan'}</div></div>`},
cpe:{n:'Edit Profil Client',f:()=>`<div class="sc">${hd(ob?'Lengkapi Profil':'Edit Profil')}<div style="display:flex;justify-content:center">${av('A',1,80)}</div><h2>Informasi Client</h2>${[['Nama client',ME.name],['Perusahaan/Organisasi',ME.org],['Industri',ME.ind],['Lokasi',ME.loc]].map((x,i)=>`<div class="s">${x[0]}</div><input id="c_${i}" value="${x[1]}">`).join('')}<div class="s">Deskripsi singkat</div><textarea id="c_bio" rows="2">${ME.cbio}</textarea><h2>Kontak</h2><div class="s">Nomor telepon</div><input id="c_ph" value="${ME.ph}"><div class="s">Email</div><input id="c_em" value="${ME.em}"><div class="btn" onclick="svp()">${ob?'Simpan Profil':'Simpan Perubahan'}</div></div>`},
apf:{n:'Profil Admin',nav:1,f:()=>`<div class="sc">${hd('Profil')}<div style="text-align:center"><div style="display:flex;justify-content:center">${av('K',0,80)}</div><h1>Katniss</h1><p class="s">Admin Talenta</p></div><div class="box">${row('Peran','Admin')}${row('Email','admin@talenta.id')}</div><div class="btn o" onclick="logout()">Keluar</div></div>${nav('apf')}`},
chat:{n:'Ruang Percakapan',nav:1,f:(o)=>{const c=role=='client',nm=CH.name||(c?'Muhammad Alif Mawapati':'Aurora Tech');if(!o)return `<div class="sc">${hd('Ruang Percakapan')}<input placeholder="Cari nama ${c?'Talent':'client'}">${CVL().map((n,i)=>`<div class="fl" style="padding:10px 0;border-bottom:1px solid #ddd" onclick="oc(${i})">${av(n,n[0]=='A')}<b style="color:#4b248c;font-size:16px;flex:1">${n} ${vf}</b><span class="s mu">12:19</span></div>`).join('')}</div>${nav(NAVS[role][1])}`;
return `<div class="sc" id="cs">${hd('Ruang Percakapan')}<div class="fl" style="border-bottom:1px solid #9d86e0;padding-bottom:8px">${av(nm,!c)}<b style="color:#4b248c;font-size:16px;flex:1">${nm} ${vf}</b>📞</div><div class="bub ${c?'':'me'}" style="background:#e7dfff;max-width:90%"><span class="s" style="color:#000">${c?'Talent Menanyakan Proyek Ini':'Kamu menanyakan proyek ini'}</span><div class="box fl" style="margin:4px 0 0;padding:6px">${th(PW(),'width:40px;height:40px;font-size:13px')}<b class="s">${PW().n}</b></div></div>${chat.map(m=>{const me=(!!m[0])!=c;return `<div class="bub ${me?'me':''}">${m[1]}</div><div class="tm" style="text-align:${me?'right':'left'}">${m[2]}</div>`}).join('')}</div><div class="fl" style="background:#e7dfff;padding:10px 14px"><span style="cursor:pointer;color:#4b248c;font-size:30px;line-height:1;width:26px;text-align:center" onclick="tg()">+</span><input id="mi" placeholder="Ketik pesan" style="margin:0;border-radius:99px;border:0" onkeydown="if(event.key=='Enter')snd()"><span class="av" style="width:36px;height:36px;cursor:pointer" onclick="snd()">${SND}</span></div><div id="at" style="display:none;background:#fff;padding:14px 20px 22px;grid-template-columns:repeat(4,1fr);gap:14px 8px;text-align:center;font-size:11px">${AT.map(x=>`<div><span class="av" style="width:54px;height:54px;margin:0 auto 4px">${x[1]}</span>${x[0]}</div>`).join('')}</div>`}},
prj:{n:'Proyek Saya',nav:1,f:(f='Semua')=>`<div class="sc">${hd('Proyek Saya')}<div class="fl"><input placeholder="Cari Proyek..." style="margin:0"><span class="btn sm" style="padding:11px;white-space:nowrap">+ Buat Proyek Baru</span></div><div class="fl s" style="justify-content:space-between;margin:14px 0">${['Semua','Draft','Publik','Dalam Proses','Selesai'].map(x=>`<span onclick="go('prj','${x}')" style="padding-bottom:3px;border-bottom:${x==f?'2px solid #4b248c':'0'};font-weight:${x==f?700:400}">${x}</span>`).join('')}</div>${P.filter(p=>f=='Semua'||p.s==f).map(p=>`<div class="box fl">${th(p)}<div style="flex:1"><b style="color:#4b248c;font-size:13px">${p.n}</b><div class="s">${p.d}<br>${p.b}</div><span class="tg ${{Publik:'g',Draft:'gr','Dalam Proses':'y',Selesai:'r'}[p.s]}">${p.s}</span> <span class="s" style="float:right;text-decoration:underline" onclick="go('prd',${P.indexOf(p)})">Lihat Detail</span></div></div>`).join('')}</div>${nav('prj')}`},
earn:{n:'Ringkasan Pendapatan',nav:1,f:()=>`<div class="sc">${hd('Ringkasan Pendapatan')}<h1 style="font-size:22px">Hi, Muhammad Alif Mawapati</h1><p class="s">Berikut ringkasan pendapatan kamu!</p><div class="hero"><span>Total Pendapatan</span><b style="display:block;font-size:24px">${rp(ER.t)}</b><div class="st3" style="text-align:left;font-size:10px;margin-top:8px"><div>Diterima<b style="font-size:13px">Rp 4.900.000</b></div><div>Menunggu<b style="font-size:13px">Rp 800.000</b></div><div>Akan Datang<b style="font-size:13px">Rp 1.000.000</b></div></div></div><h2>Pembayaran Proyek Berjalan <span class="s" style="float:right;font-weight:400" onclick="go('mil')">Lihat Detail ›</span></h2><div class="box fl" onclick="go('mil')">${th(P[0],'width:56px;height:56px')}<div style="flex:1"><b style="color:#4b248c">${P[0].n}</b><div class="s">Rp 1.400.000 | 30 November 2026</div><div class="pr"><i style="width:28.57%"></i></div></div></div><h2>List Milestone <span class="s" style="float:right;font-weight:400;cursor:pointer" onclick="go('hist')">Lihat Semua ›</span></h2>${[['Strategi Marketing','Sudah Dibayar','g','Rp 4.500.000 | 30 Maret 2025'],['UI/UX Designer untuk Aplikasi Mobile','Dalam Proses','bl','Rp 1.400.000 | 30 November 2026'],['Desain UI/UX','Menunggu','y','Rp 800.000 | 30 November 2026']].map((m,i)=>`<div class="box" ${i==1?`onclick="go('mil')"`:''}><div class="row"><b>${m[0]}</b><span class="tg ${m[2]}">${m[1]}</span></div><div class="s mu">${m[3]}</div></div>`).join('')}</div>${nav('dash')}`},
mil:{n:'Detail Milestone',nav:1,f:()=>`<div class="sc">${hd('Detail Milestone')}<div class="box fl">${th(P[0],'width:50px;height:50px;font-size:16px')}<div><b style="color:#4b248c">${P[0].n}</b><div class="s">by Aurora Tech</div><span class="ch">Desain &amp; Kreatif</span></div></div><h2>Informasi Milestone</h2><div class="box">${row('Nama Tahapan','Eksplorasi Design')}${row('Hasil Pekerjaan','Wireframe dan Moodboard')}${row('Tenggat Akhir','30 November 2026')}</div><h2>Rincian Pembayaran</h2><div class="box">${row('Nominal Pembayaran Tahapan','Rp 400.000')}${row('Total Anggaran Project','Rp 1.400.000')}</div><h2>Status</h2><div class="box">${row('Status Pengumpulan','<span class="tg bl">Sudah Dikumpulkan</span>')}</div><div class="box">${row('Status Persetujuan Client','<span class="tg g">Disetujui</span>')}</div><h2>Riwayat Transaksi <span class="s" style="float:right;font-weight:400;cursor:pointer" onclick="go('hist')">Lihat Semua ›</span></h2><div class="box">${row('#TRX123456789','<span class="tg g">Berhasil</span>')}${row('25 November 2026','+Rp 400.000')}<div class="btn l" onclick="go('bkt')">Lihat Bukti Pembayaran</div></div></div>${nav('dash')}`},
hist:{n:'Riwayat Transaksi',nav:1,f:()=>`<div class="sc">${hd('Riwayat Transaksi')}<div class="hero fl" style="padding:20px"><span style="font-size:36px">▮▮▮</span><div>Total Pendapatan<b style="display:block;font-size:24px">${rp(ER.t)}</b></div></div><div style="height:14px"></div>${[[0,'Dalam Proses','bl','Rp 1.000.000','25 November 2026'],[0,'Berhasil','g','+Rp 400.000','25 November 2026'],[1,'Menunggu','y','Rp 800.000','24 November 2026'],[3,'Berhasil','g','+Rp 4.500.000','30 Maret 2026']].map((t,i)=>`<div class="box fl" ${i==1?`onclick="go('bkt')"`:''}>${th(P[t[0]],'width:56px;height:56px;font-size:16px')}<div style="flex:1"><b style="color:#4b248c;font-size:13px">${P[t[0]].n}</b><div class="row" style="padding:2px 0"><span class="s">#TRX123456789</span><span class="tg ${t[2]}">${t[1]}</span></div><div class="row" style="padding:0"><span class="s mu">${t[4]}</span><b style="color:#0a7a2a">${t[3]}</b></div></div></div>`).join('')}<div class="btn l">Download Riwayat Pembayaran</div></div>${nav('dash')}`},
bkt:{n:'Bukti Pembayaran',nav:1,f:()=>`<div class="sc">${hd('Bukti Pembayaran')}<div style="text-align:center"><div class="av" style="width:80px;height:80px;margin:10px auto;font-size:36px">✔</div><h1 style="font-size:24px">Pembayaran Berhasil</h1><hr></div><h2>Detail Transaksi</h2><div class="box">${row('ID Transaksi','#TRX123456789')}${row('Nama Proyek',P[0].n)}${row('Nama Client','Aurora Tech')}${row('Nama Tahapan','Eksplorasi Desain')}${row('Hasil Pekerjaan','Wireframe dan Moodboard')}<hr>${row('Nominal Pembayaran','Rp 400.000')}${row('Total Anggaran Proyek','Rp 1.400.000')}${row('Metode Pembayaran','Transfer Bank')}${row('Status Transaksi','<span class="tg g">Berhasil</span>')}</div><div class="btn l">${I('dl',15)} Unduh Bukti Pembayaran</div><div class="btn o" onclick="go('mil')">Kembali ke Detail Milestone</div></div>${nav('dash')}`}
};
let spT;
S.splash={n:'Splash Screen',f:()=>{clearTimeout(spT);spT=setTimeout(()=>{if(cur&&cur[0]=='splash')show('onb',0)},matchMedia('(prefers-reduced-motion:reduce)').matches?1200:5000);return `<div class="spl" onclick="clearTimeout(spT);show('onb',0)"><svg class="spa" viewBox="0 0 402 874" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;background:#9ba8ff">${cirs()}</svg><div class="spb"><img class="spc" src="${IM.sp2}" alt="Talenta"></div></div>`}};
S.role={n:'Login Sebagai',f:()=>`<div class="gl"><div class="sh" style="padding-bottom:40px"><h3 class="rt">Login Sebagai</h3>${[['Talent','#4b248c','#fff'],['Client','#a58fc9','#2a0f5c'],['Admin','#ece6f4','#2a0f5c']].map(r=>`<div class="rb" style="background:${r[1]};color:${r[2]}" onclick="sr('${r[0].toLowerCase()}')">${r[0]}</div>`).join('')}</div></div>`};
S.login={n:'Login / Daftar',f:(reg)=>{const ad=role=='admin',rg=reg&&!ad;return `<div class="gl"><div class="sh" style="min-height:min(580px,88%)"><i class="bk" style="position:absolute;right:28px;top:68px" onclick="bk()">‹</i><h2>${rg?'Selamat Datang di Talenta':'Selamat Datang Kembali!'}</h2>${rg?'<label>Name</label><input placeholder="Full Name" autocomplete="name">':''}<label>Email</label><input type="email" placeholder="123@gmail.com"><label>Password</label><input type="password" placeholder="******"><div class="lb" onclick="${rg?`ob=1;kt=0;stack=[];cur=null;show('${role=='client'?'cpe':'ktm'}')`:`stack=[];cur=null;show('dash')`}">${rg?'Sign In':'Login'}</div>${ad?'':`<div class="ft">${rg?'Sudah memiliki akun?':'Belum memiliki akun?'} <u onclick="show('login',${rg?0:1})">${rg?'Login':'Sign in'}</u></div>`}</div></div>`}};
S.prj={n:'Proyek Saya',nav:1,f:(f='Semua')=>`<div class="sc">${hd('Proyek Saya')}<div class="fl"><input placeholder="Cari Proyek..." style="margin:0" oninput="fq(this)"><span class="btn sm" style="padding:11px;white-space:nowrap" onclick="np()">+ Buat Proyek Baru</span></div><div class="fl s" style="justify-content:space-between;margin:14px 0">${['Semua','Draft','Publik','Dalam Proses','Selesai'].map(x=>`<span onclick="show('prj','${x}')" style="padding-bottom:3px;border-bottom:${x==f?'2px solid #4b248c':'0'};font-weight:${x==f?700:400};cursor:pointer">${x}</span>`).join('')}</div>${CP.filter(p=>f=='Semua'||p.s==f).map(p=>`<div class="box fl it">${th(p)}<div style="flex:1"><b style="color:#4b248c;font-size:13px">${p.n}</b><div class="s">${p.d}<br>${p.b}</div><span class="tg ${ST[p.s]}">${p.s}</span> <span class="s" style="float:right;text-decoration:underline;cursor:pointer" onclick="go('cpd',${CP.indexOf(p)})">Lihat Detail</span></div></div>`).join('')}</div>${nav('prj')}`};
S.fp1={n:'Form Pembuatan Proyek (1)',f:()=>`<div class="sc">${hd('Form Pembuatan Proyek')}${stp(1)}<h2>Buat Proyek</h2><div class="s">Judul Proyek</div><input value="UI/UX Designer untuk Aplikasi Mobile"><div class="s">Unggah Gambar Proyek</div><div class="box s" style="border-style:dashed;text-align:center;color:#4b248c">Unggah gambar yang membantu merepresentasikan proyek</div><div class="s">Deskripsi Proyek</div><textarea rows="4">Membuat desain UI/UX aplikasi mobile yang modern, intuitif, dan mudah digunakan oleh pengguna.</textarea><div class="s">Kategori Proyek</div><select class="f"><option>Desain & Kreatif</option><option>Pemasaran & Media</option><option>Teknologi & Pengembangan</option><option>Data & Analitik</option></select><div class="s">Keahlian diperlukan</div>${ch(['Design ✕','Figma ✕','Add Skill ✕'])}<div class="s" style="margin-top:8px">Cakupan Kerja</div><textarea id="fps" rows="3">${FPD.scope}</textarea><div class="btn" onclick="go('fp2')">Lanjut</div></div>`};

      if(ex.length){r=await sb.from('talent_experiences').insert(ex);if(r.error)throw r.error}
      const {data:old}=await sb.from('talent_skills').select('skill_id,skills(name)').eq('talent_id',ME.id);
      for(const s of (old||[])){if(!SKS.tpe.some(n=>n.toLowerCase()==s.skills.name.toLowerCase()))await sb.from('talent_skills').delete().eq('talent_id',ME.id).eq('skill_id',s.skill_id)}
      for(const n of SKS.tpe){r=await sb.rpc('add_my_skill',{p_name:n});if(r.error)throw r.error}
    }else{
      r=await sb.from('profiles').update({full_name:g('c_0')}).eq('id',ME.id);if(r.error)throw r.error;
      r=await sb.from('client_profiles').update({organization:g('c_1'),industry:g('c_2'),location:g('c_3'),bio:g('c_bio'),contact_phone:g('c_ph'),contact_email:g('c_em')}).eq('user_id',ME.id);if(r.error)throw r.error;
    }
    await loadMe();FR.tals=0
  }catch(e){toast(e.message);return}
  if(ob){ob=0;stack=[];cur=null;show('dash')}else bk()};
const _sav=sav;
sav=async function(i){
  if(!LIVE)return _sav(i);const p=P[i];
  if(SV.has(i)){await sb.from('saved_projects').delete().eq('talent_id',ME.id).eq('project_id',p.id);SV.delete(i)}
  else{const {error}=await sb.from('saved_projects').insert({talent_id:ME.id,project_id:p.id});if(error){toast(error.message);return}SV.add(i)}
  show(cur[0],cur[1])};
function np(){FPD={title:'',description:'',cat:'Desain & Kreatif',scope:'',budget:0,deadline:''};FPID=null;SKS.fp.length=0;go('fp1')}
function fpRead(){const g=i=>(document.getElementById(i)||{}).value||'';return {title:g('fpt'),description:g('fpd'),cat:g('fpc'),scope:g('fps'),budget:parseInt(g('fpb').replace(/\D/g,''))||0,deadline:g('fpl')}}
function nxt(){FPD=fpRead();go('fp2')}
async function fpSave(status){
  const d=FPD;const {data:ct}=await sb.from('project_categories').select('id').eq('name',d.cat).maybeSingle();
  const row={client_id:ME.id,title:d.title||'Proyek Baru',description:d.description,scope:d.scope,budget:d.budget,deadline:d.deadline||null,category_id:ct?ct.id:null,status};
  const r=FPID?await sb.from('projects').update(row).eq('id',FPID).select('id').single():await sb.from('projects').insert(row).select('id').single();
  if(r.error)throw r.error;FPID=r.data.id;const s=await sb.rpc('set_project_skills',{p_project:FPID,p_names:SKS.fp});if(s.error)throw s.error;FR.cp=0}
const _svd=svd;
svd=async function(){if(!LIVE)return _svd();FPD=fpRead();try{await fpSave('draft');FPID=null;stack=[['dash']];cur=null;show('prj','Draft')}catch(e){toast(e.message)}};
async function pub(){if(LIVE){try{await fpSave('published');FPID=null}catch(e){toast(e.message);return}}stack=[['dash']];cur=null;show('prj','Publik')}
